<header class="header" id="header">
    <div class="container">
        <div class="header__content">
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#">Menu</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#specials">Specials</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#">Our story</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#">Contact us</a>
                    </li>
                </ul>
            </nav>
            <div class="header__logo-wrap">
                <a class="header__logo" href="#">
                    <img src="./images/icons/logo.svg" alt="logo">
                </a>
            </div>
            <div class="header__contacts">
                <div class="header__contacts-wrap">
                    <p class="header__contacts-title">Location</p>
                    <a class="header__contacts-block link" href="#">
                        <img src="../images/icons/geo.svg" alt="icon-geo">
                        <p class="header__contacts-text">88 Lê Hữu Trác, An Hải, Đà Nẵng</p>
                    </a>
                </div>
                <div class="header__contacts-wrap">
                    <p class="header__contacts-title">Open daily</p>
                    <span class="header__contacts-block">
                        <img src="./images/icons/time.svg" alt="icon-time">
                        <p class="header__contacts-text">10am–Late</p>
                    </span>
                </div>
            </div>
            <button class="header__burger"><span></span></button>
        </div>
    </div>
</header>

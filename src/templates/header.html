<header class="header" id="header">
    <div class="container">
        <div class="header__content">
            <div class="overlay"></div>
            <button class="header__burger burger"><span></span></button>
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__list-item">
                        <a class="header__link link link--close" target="_blank"
                            href="https://drive.google.com/drive/folders/1ePUHSmmJo3Pp5_FpyYjS_Rekz61032Zc">Menu</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#specials">Specials</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" target="_blank"
                            href="https://maps.app.goo.gl/vHR2as7eqCFhwbYk8">Our story</a>
                    </li>
                    <li class="header__list-item">
                        <a class="header__link link link--close" href="#contact">Contact us</a>
                    </li>
                </ul>
                <div class="lang-wrap">
                    <ul class="lang-box">
                        <li class="lang-item lang-item-2 current-lang lang-item-first">
                            <a lang="en" hreflang="en" href="#">en</a>
                        </li>
                        <li class="lang-item lang-item-5 lang-item-ua">
                            <a lang="vn" hreflang="ua" href="#">vn</a>
                        </li>
                        <li class="lang-item lang-item-5 lang-item-ua">
                            <a lang="ua" hreflang="ua" href="#">ua</a>
                        </li>
                        <li class="lang-item lang-item-5 lang-item-ua">
                            <a lang="ru" hreflang="ua" href="#">ru</a>
                        </li>
                    </ul>
                </div>
                <div class="header__info info">
                    <a class="header__info-logo info__logo" href="#">
                        <img src="./images/icons/logo2.svg" alt="logo">
                    </a>
                    <p class="header__info-title info__title">Open daily</p>
                    <div class="info__item-wrap">
                        <div class="header__info-item info__item">
                            <img class="info__icon" src="./images/icons/info-time.svg" alt="icon">
                            <p class="header__info-text info__text">Kitchen 10am–10pm <br> Bar 10am–Late</p>
                        </div>
                        <a class="header__info-item header__info-item--link info__item info__item--link" target="_blank"
                            href="https://maps.app.goo.gl/LNCed9rN793CzvhZ7">
                            <img class="info__icon" src="./images/icons/info-geo.svg" alt="icon">
                            <p class="header__info-text info__text">88 Lê Hữu Trác, An Hải, Đà Nẵng</p>
                        </a>
                        <a class="header__info-item header__info-item--link info__item info__item--link" target="_blank"
                            href="mailto:idle.lazy.bar@gmail.com">
                            <img class="info__icon" src="./images/icons/info-mail.svg" alt="icon">
                            <p class="header__info-text info__text">idle.lazy.bar@gmail.com</p>
                        </a>
                        <a class="header__info-item header__info-item--link info__item info__item--link" target="_blank"
                            href="tel:0352117813">
                            <img class="info__icon" src="./images/icons/info-phone.svg" alt="icon">
                            <p class="header__info-text info__text">0352 117 813</p>
                        </a>
                    </div>
                </div>
                <div class="header__socials socials">
                    <a class="header__socials-link socials__link" target="_blank"
                        href="https://www.instagram.com/idle.danang">
                        <img class="header__socials-icon socials__icon" src="./images/icons/insta.svg" alt="soc icon">
                    </a>
                </div>
            </nav>
